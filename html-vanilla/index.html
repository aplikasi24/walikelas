    <script>
        // Apply theme immediately to prevent flash
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        // Prevent dashboard flash on login page
        const initialAuth = localStorage.getItem('auth_user');
        if (!initialAuth || initialAuth === 'null') {
            document.documentElement.classList.add('not-logged-in');
        }

        window.toggleTheme = function() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            
            // Re-render dashboard if we are on it to update the icon
            if (typeof window.navigateTo === 'function' && typeof currentPage !== 'undefined' && currentPage === 'dashboard') {
                window.navigateTo('dashboard');
            } else if (typeof navigateTo === 'function' && typeof currentPage !== 'undefined' && currentPage === 'dashboard') {
                navigateTo('dashboard');
            }
        };
    </script>

    <!-- Application Logic (Vanilla JS SPA + PWA) -->
    <script>
        // --- APPSCRIPT BACKEND URL ---
        // GANTI URL INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA
        const APPSCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-A-OC3zLNstXeZNymplCvu9QTXCPI1VC-_zv7AV397p-ekGvQsdfxp0Dmk5R0INBu/exec';
        
        window.currentUser = JSON.parse(localStorage.getItem('auth_user') || 'null');

        // --- AUTH LOGIC ---
        window.toggleAuthMode = (mode) => {
            if(mode === 'register') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
                document.getElementById('auth-title').innerText = 'Daftar Akun Baru';
            } else {
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('auth-title').innerText = 'Masuk ke Aplikasi';
            }
        };

        let isFetchingMessages = false;
        window.loadMessages = async (preventNavigate = false) => {
            if (!window.currentUser || isFetchingMessages) return;
            isFetchingMessages = true;
            try {
                const res = await fetch(APPSCRIPT_URL + '?action=getMessages');
                const data = await res.json();
                if (data.status === 'success') {
                    db.pesan_info = data.data.map((msg, i) => ({
                        id: i + 1,
                        pengirim: msg.pengirim,
                        teks: (msg.judul ? msg.judul + "\n\n" : "") + msg.isi,
                        waktu: msg.tanggal,
                        gambar_url: msg.gambar_url || "",
                        link_url: msg.link_url || ""
                    }));
                    saveDB();
                    if (window.currentPage === 'pesan' && !preventNavigate) {
                        navigateTo('pesan', true);
                    }
                }
            } catch (err) {
                console.error('Failed to load messages', err);
            } finally {
                isFetchingMessages = false;
            }
        };

        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login');
            
            // Tampilkan Overlay Loading
            const overlay = document.getElementById('login-overlay');
            const percentText = document.getElementById('login-percent');
            const circle = document.getElementById('login-spinner-circle');
            
            if (overlay) {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            }
            
            let percent = 0;
            const circumference = 251; // 2 * pi * r (r=40)
            
            // Animasi persentase palsu (naik cepat di awal, lambat di akhir)
            const interval = setInterval(() => {
                if (percent < 85) {
                    percent += Math.floor(Math.random() * 15) + 5;
                    if (percent > 85) percent = 85;
                    if (percentText) percentText.innerText = percent + '%';
                    if (circle) circle.style.strokeDashoffset = circumference - (percent / 100) * circumference;
                }
            }, 200);

            btn.disabled = true;

            try {
                const res = await fetch(APPSCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        action: 'login',
                        data: JSON.stringify({ email, password })
                    })
                });
                const data = await res.json();
                
                clearInterval(interval);
                
                if (data.status === 'success') {
                    // Set ke 100%
                    if (percentText) percentText.innerText = '100%';
                    if (circle) circle.style.strokeDashoffset = 0;
                    document.getElementById('login-overlay-text').innerText = "Berhasil masuk!";
                    
                    await new Promise(r => setTimeout(r, 600));
                    
                    window.currentUser = data.user;
                    localStorage.setItem('auth_user', JSON.stringify(data.user));
                    
                    document.documentElement.classList.remove('not-logged-in');
                    document.getElementById('auth-screen').style.display = 'none';
                    if(overlay) {
                        overlay.classList.add('opacity-0');
                        setTimeout(() => overlay.classList.add('hidden'), 300);
                    }

                    // Panggil bootApp() yang sudah di-load dari app_logic.js
                    try {
                        bootApp();
                    } catch(bootErr) {
                        console.error('bootApp error:', bootErr);
                    }
                    window.loadMessages();
                    
                    // Gunakan window.showAlert jika ada, atau alert biasa
                    if(typeof window.showAlert === 'function') {
                        window.showAlert("Login Berhasil! Selamat datang " + data.user.nama);
                    } else {
                        alert("Login Berhasil! Selamat datang " + data.user.nama);
                    }
                } else {
                    if(overlay) {
                        overlay.classList.add('opacity-0');
                        setTimeout(() => overlay.classList.add('hidden'), 300);
                    }
                    const errorDiv = document.getElementById('login-error');
                    errorDiv.classList.remove('hidden');
                    if (data.message && data.message.includes('belum disetujui')) {
                        errorDiv.innerHTML = 'Akun belum diaktifkan silahkan tunggu / hubungi admin di <a href="https://appzain.my.id" target="_blank" class="font-bold underline text-red-700 hover:text-red-900">https://appzain.my.id</a>';
                    } else {
                        errorDiv.innerText = data.message || 'Login gagal.';
                    }
                }
            } catch(err) {
                clearInterval(interval);
                if(overlay) {
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                }
                const errorDiv = document.getElementById('login-error');
                errorDiv.classList.remove('hidden');
                errorDiv.innerText = 'Error: ' + err.message;
                console.error(err);
            } finally {
                btn.disabled = false;
            }
        };

        window.handleForgotPassword = async () => {
            const email = await window.showPrompt('Masukkan email akun Anda untuk mereset password:', '');
            if (!email) return;
            
            window.showAlert("Sedang memproses permintaan Anda...");
            
            try {
                const res = await fetch(APPSCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        action: 'forgotPassword',
                        data: JSON.stringify({ email: email })
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    window.showAlert("Password telah berhasil dikirim ke email Anda! Silakan cek kotak masuk (atau folder spam).");
                } else {
                    window.showAlert("Gagal: " + data.message);
                }
            } catch(e) {
                window.showAlert("Terjadi kesalahan sistem saat menghubungi server.");
            }
        };

        window.handleRegister = async (e) => {
            e.preventDefault();
            const payload = {
                nama: document.getElementById('reg-nama').value,
                sekolah: document.getElementById('reg-sekolah').value,
                npsn: document.getElementById('reg-npsn').value,
                wa: document.getElementById('reg-wa').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value
            };
            const btn = document.getElementById('btn-register');
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Menyimpan...';
            btn.disabled = true;

            try {
                const res = await fetch(APPSCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        action: 'register',
                        data: JSON.stringify(payload)
                    })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    alert("Registrasi berhasil! Silakan hubungi admin untuk menyetujui akun Anda.");
                    window.toggleAuthMode('login');
                    document.getElementById('register-form').reset();
                } else {
                    alert(data.message || 'Registrasi gagal.');
                }
            } catch(err) {
                alert('Gagal menghubungi server. Pastikan URL AppScript benar dan Anda terhubung internet.');
            } finally {
                btn.innerHTML = 'Daftar Akun';
                btn.disabled = false;
            }
        };

        window.handleLogout = () => {
            if(confirm("Anda yakin ingin keluar dari aplikasi?")) {
                window.currentUser = null;
                localStorage.removeItem('auth_user');
                location.reload();
            }
        };

        // Cek Login Saat Dimuat
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('auth_user');
            if (savedUser && savedUser !== 'null') {
                window.currentUser = JSON.parse(savedUser);
                document.getElementById('auth-screen').style.display = 'none';
                document.documentElement.classList.remove('not-logged-in');
                // bootApp dipanggil dari app_logic.js saat load jika currentUser sudah ada
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        });
    </script>

    <!-- ===== APP LOGIC (LOCAL FILE) ===== -->
    <script src="../appscript_backend/app_logic.html"></script>
</body>
